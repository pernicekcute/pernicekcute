<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Titlebar Page 🎵</title>
  <style>
    /* Základní nastavení stránky 🎨 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      padding-top: 90px; /* Upravené odsazení pro plovoucí pill 📏 */
    }

    /* Fixní plovoucí pill lišta (Pill Titlebar) 💊📌 */
    .titlebar {
      position: fixed;
      top: 4px; /* Odsazení shora 4px 🔝 */
      left: 4px; /* Odsazení zleva 4px ⬅️ */
      right: 4px; /* Odsazení zprava 4px ➡️ */
      width: calc(100% - 8px); /* Přesná šířka s odsazením 📐 */
      height: 64px;
      background-color: rgba(0, 0, 0, 0.85); /* Mírná průhlednost ✨ */
      backdrop-filter: blur(12px); /* Blur efekt pozadí 🌫️ */
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-radius: 50px; /* Pill design (plně zaoblené rohy) 💊 */
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25); /* Plovoucí stín 🌌 */
      border: 1px solid rgba(255, 255, 255, 0.15); /* Jemný okraj 🖼️ */
      z-index: 1000;
    }

    /* Profilová část v liště 👤 */
    .profile-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #25f4ee; /* TikTok tyrkysový akcent ✨ */
    }

    .profile-info {
      display: flex;
      flex-direction: column;
    }

    .display-name {
      font-weight: bold;
      font-size: 1rem;
    }

    /* Testovací obsah pro skrolování 📜 */
    .content {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>

  <!-- Horní plovoucí pill lišta 💊📌 -->
  <header class="titlebar">
    <div class="profile-container">
      <img id="tiktok-avatar" class="profile-avatar" src="" alt="TikTok PFP">
      <div class="profile-info">
        <span id="tiktok-display-name" class="display-name">Načítání...</span>
      </div>
    </div>
    <div style="font-size: 1.3rem; margin-right: 8px;">🎵</div>
  </header>

  <!-- Hlavní obsah stránky 📄 -->
  <main class="content">
    <div class="card">
      <h2>Vítej na stránce! 🎉</h2>
      <p>Vyzkoušej skrolovat dolů a nahoru 📜. Pill lišta nahoře plave 4px od okrajů! 💊✨</p>
    </div>
    
    <!-- Prodloužený obsah pro test skrolování -->
    <div class="card" style="height: 400px;">
      <h3>Obsah blok 1 📦</h3>
      <p>Skroluj dál... 👇</p>
    </div>
    <div class="card" style="height: 400px;">
      <h3>Obsah blok 2 📦</h3>
      <p>A ještě dál... 👇</p>
    </div>
  </main>

  <script>
    // ⚙️ NASTAVENÍ: Tvoje nastavená jména 🎯
    const tiktokUsername = 'rockyroad_doors';
    const tiktokDisplayName = 'Rocky Road ';

    // Skript pro načtení hodnot 🛠️
    document.addEventListener('DOMContentLoaded', () => {
      const avatarEl = document.getElementById('tiktok-avatar');
      const displayNameEl = document.getElementById('tiktok-display-name');

      // Načtení TikTok profilovky přes Unavatar 🖼️
      avatarEl.src = `https://unavatar.io/tiktok/${tiktokUsername}`;
      displayNameEl.textContent = tiktokDisplayName;
    });
  </script>
</body>
</html>

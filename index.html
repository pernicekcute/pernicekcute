<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Titlebar Page 🎵</title>
  <style>
    /* 🎨 CSS Proměnné pro Light Mode (Světlý režim) ☀️ */
    :root {
      --bg-color: #f2f2f7; /* Pravé iOS šedé pozadí 🍏 */
      --text-color: #000000;
      --card-bg: #ffffff;
      
      /* 🍏 PRAVÉ iOS Liquid Glass - Světlý 🧊 */
      --titlebar-bg: rgba(255, 255, 255, 0.45); /* Mírně bělejší, aby to sklo mělo hmotu */
      --titlebar-border: rgba(0, 0, 0, 0.05); 
      --titlebar-shadow: rgba(0, 0, 0, 0.08);
      
      /* Blur je zpět! Bez něj to není sklo. 25px je nativní iOS hodnota! ✨ */
      --glass-filter: blur(25px) saturate(200%); 
      --glass-inset: inset 0 1px 1px rgba(255, 255, 255, 0.8);
    }

    /* 🌙 Automatický Dark Mode podle systému 📱 */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #000000; /* Pravá černá */
        --text-color: #ffffff;
        --card-bg: #1c1c1e;
        
        /* 🍏 PRAVÉ iOS Liquid Glass - Tmavý 🧊 */
        --titlebar-bg: rgba(30, 30, 30, 0.55); 
        --titlebar-border: rgba(255, 255, 255, 0.1); 
        --titlebar-shadow: rgba(0, 0, 0, 0.4);
        --glass-filter: blur(25px) saturate(200%);
        --glass-inset: inset 0 1px 1px rgba(255, 255, 255, 0.15);
      }
    }

    /* Základní nastavení stránky 🎨 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color); 
      color: var(--text-color);
      padding-top: 90px;
      transition: background-color 0.3s ease, color 0.3s ease; 
    }

    /* Fixní plovoucí pill lišta 💊📌 */
    .titlebar {
      position: fixed;
      top: 4px;
      left: 4px;
      right: 4px;
      width: calc(100% - 8px);
      height: 64px;
      
      background: var(--titlebar-bg); 
      
      /* ✨ Pravý nativní filter pro to pravé sklo! 💎 */
      backdrop-filter: var(--glass-filter);
      -webkit-backdrop-filter: var(--glass-filter); /* Toto je nutné pro iPhone! 📱 */
      
      color: var(--text-color); 
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-radius: 50px;
      
      box-shadow: 0 8px 24px var(--titlebar-shadow), var(--glass-inset);
      border: 1px solid var(--titlebar-border); 
      z-index: 1000;
      transition: all 0.3s ease;
    }

    /* Profilová část v liště 👤 */
    .profile-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(150, 150, 150, 0.3); 
    }

    .profile-info {
      display: flex;
      flex-direction: column;
    }

    .display-name {
      font-weight: 600; 
      font-size: 1rem;
      letter-spacing: -0.3px; 
    }

    /* Testovací obsah pro skrolování 📜 */
    .content {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 20px; 
      margin-bottom: 20px;
      box-shadow: 0 2px 10px var(--titlebar-shadow);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .gradient-card-1 {
      background: linear-gradient(135deg, rgba(255, 154, 158, 0.9) 0%, rgba(254, 207, 239, 0.9) 100%);
      color: #000;
    }
    
    .gradient-card-2 {
      background: linear-gradient(120deg, rgba(161, 196, 253, 0.9) 0%, rgba(194, 233, 251, 0.9) 100%);
      color: #000;
    }
  </style>
</head>
<body>

  <!-- Horní plovoucí pill lišta 💊📌 -->
  <header class="titlebar">
    <div class="profile-container">
      <img id="tiktok-avatar" class="profile-avatar" src="" alt="TikTok PFP">
      <div class="profile-info">
        <span id="tiktok-display-name" class="display-name">Načítání...</span>
      </div>
    </div>
    <div style="font-size: 1.3rem; margin-right: 8px;">🎵</div>
  </header>

  <!-- Hlavní obsah stránky 📄 -->
  <main class="content">
    <div class="card">
      <h2>Zkus to teď! 🎉</h2>
      <p>Vrátil jsem tam pravý iOS Blur (25px). Bez něj je to totiž jen průhledná fólie! Teď už by texty pod lištou neměly dělat tu nečitelnou paseku. 💎✨</p>
    </div>
    
    <div class="card gradient-card-1" style="height: 400px;">
      <h3>Barevný blok 1 🎨📦</h3>
      <p>Skroluj dolů a kochej se! 👇</p>
    </div>
    <div class="card gradient-card-2" style="height: 400px;">
      <h3>Barevný blok 2 🌊📦</h3>
      <p>Pravé sklo! 💎✨</p>
    </div>
  </main>

  <script>
    const tiktokUsername = 'rockyroad_doors';
    const tiktokDisplayName = 'Rocky Road ';

    document.addEventListener('DOMContentLoaded', () => {
      const avatarEl = document.getElementById('tiktok-avatar');
      const displayNameEl = document.getElementById('tiktok-display-name');

      avatarEl.src = `https://unavatar.io/tiktok/${tiktokUsername}`;
      displayNameEl.textContent = tiktokDisplayName;
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Titlebar Page 🎵</title>
  <style>
    /* Základní nastavení stránky 🎨 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      padding-top: 90px; /* Upravené odsazení pro plovoucí pill 📏 */
    }

    /* Fixní plovoucí pill lišta (Pill Titlebar) 💊📌 */
    .titlebar {
      position: fixed;
      top: 4px;
      left: 4px;
      right: 4px;
      width: calc(100% - 8px);
      height: 64px;
      
      /* 🌟 ZDE JE ZMĚNA: Pozadí na 20 % (0.2) pro maximální blur efekt! 🧊 */
      background-color: rgba(0, 0, 0, 0.3); 
      backdrop-filter: blur(15px); /* Trochu silnější blur, ať to na těch 20 % vynikne 🌫️ */
      -webkit-backdrop-filter: blur(15px);
      
      /* Změna barvy textu na tmavou pro lepší čitelnost na světlém pozadí 🖋️ */
      color: #333333; 
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* Jemnější stín pro čistší vzhled 🌌 */
      border: 1px solid rgba(0, 0, 0, 0.1); /* Tmavší, ale velmi jemný okraj 🖼️ */
      z-index: 1000;
    }

    /* Profilová část v liště 👤 */
    .profile-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #25f4ee; /* TikTok tyrkysový akcent ✨ */
    }

    .profile-info {
      display: flex;
      flex-direction: column;
    }

    .display-name {
      font-weight: bold;
      font-size: 1rem;
    }

    /* Testovací obsah pro skrolování 📜 */
    .content {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>

  <!-- Horní plovoucí pill lišta 💊📌 -->
  <header class="titlebar">
    <div class="profile-container">
      <img id="tiktok-avatar" class="profile-avatar" src="" alt="TikTok PFP">
      <div class="profile-info">
        <span id="tiktok-display-name" class="display-name">Načítání...</span>
      </div>
    </div>
    <div style="font-size: 1.3rem; margin-right: 8px;">🎵</div>
  </header>

  <!-- Hlavní obsah stránky 📄 -->
  <main class="content">
    <div class="card">
      <h2>Vítej na stránce! 🎉</h2>
      <p>Vyzkoušej skrolovat dolů a nahoru 📜. Pill lišta nahoře plave 4px od okrajů a díky 20% pozadí je krásně vidět ten skleněný blur! 💊🧊✨</p>
    </div>
    
    <!-- Prodloužený obsah pro test skrolování -->
    <div class="card" style="height: 400px; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);">
      <h3>Barevný blok 1 🎨📦</h3>
      <p>Tady skvěle uvidíš ten průhledný efekt, když přes to přeskroluješ! 👇</p>
    </div>
    <div class="card" style="height: 400px; background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%);">
      <h3>Barevný blok 2 🌊📦</h3>
      <p>A ještě dál... 👇</p>
    </div>
  </main>

  <script>
    // ⚙️ NASTAVENÍ: Tvoje nastavená jména 🎯
    const tiktokUsername = 'rockyroad_doors';
    const tiktokDisplayName = 'Rocky Road ';

    // Skript pro načtení hodnot 🛠️
    document.addEventListener('DOMContentLoaded', () => {
      const avatarEl = document.getElementById('tiktok-avatar');
      const displayNameEl = document.getElementById('tiktok-display-name');

      // Načtení TikTok profilovky přes Unavatar 🖼️
      avatarEl.src = `https://unavatar.io/tiktok/${tiktokUsername}`;
      displayNameEl.textContent = tiktokDisplayName;
    });
  </script>
</body>
</html>
